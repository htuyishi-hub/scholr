kind = "web"
previewPath = "/"
title = "scholr"
version = "1.0.0"
id = "artifacts/scholr"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26123

[services.development]
run = "pnpm --filter @workspace/scholr run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scholr", "run", "build" ]
publicDir = "artifacts/scholr/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26123"
BASE_PATH = "/"
