# Railway config-as-code for the BACKEND service (Express API)
# This is placed at repo root so Railway can auto-detect build/start.
# Project root for this service: artifacts/api-server

[build]
# Build from the workspace package
command = "cd artifacts/api-server && pnpm install --frozen-lockfile && pnpm run build"

[deploy]
# Start the built server (requires PORT provided by Railway)
startCommand = "cd artifacts/api-server && pnpm start"


[healthcheck]
# Mounted by api-server at /api/healthz
path = "/api/healthz"
intervalSeconds = 10
timeoutSeconds = 5
failureThreshold = 3

