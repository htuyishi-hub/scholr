
# Railway multi-service config (deploy frontend + backend together)

services:
  - name: scholarship-api
    type: web
    build:
      command: "pnpm install --frozen-lockfile && pnpm -r --filter @workspace/api-server run build"
    start:
      command: "cd artifacts/api-server && pnpm start"
    healthcheck:
      path: /api/healthz
      intervalSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    env:
      - key: NODE_ENV
        value: production

  - name: scholarship-web
    type: web
    build:
      command: "cd artifacts/scholr && pnpm install --frozen-lockfile && pnpm run build"
    start:
      command: "cd artifacts/scholr && npx --yes serve -s dist/public -l $PORT --no-clipboard"
    healthcheck:
      path: /
      intervalSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    env:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: "https://scholarship-api.up.railway.app"


