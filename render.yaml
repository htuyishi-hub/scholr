services:
  - type: web
    name: scholarship-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    # Builds both the React frontend (scholr) and the API server so that
    # artifacts/scholr/dist/public exists when Express tries to serve it.
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm -r --filter @workspace/scholr --filter @workspace/api-server run build
    startCommand: cd artifacts/api-server && pnpm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false   # Set this manually in the Render dashboard → your Supabase URI
      - key: JWT_SECRET
        generateValue: true
