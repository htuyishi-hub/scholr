databases:
  - name: scholarship-db
    databaseName: scholarship
    user: scholarship
    plan: free
    region: oregon

services:
  - type: web
    name: scholarship-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm -r --filter @workspace/api-server run build
    startCommand: cd artifacts/api-server && pnpm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scholarship-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
