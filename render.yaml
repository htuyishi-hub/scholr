services:
  # Backend only. The frontend is deployed separately on Vercel
  # (see vercel.json + DEPLOYMENT.md).
  - type: web
    name: scholarship-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    # Render's image ships a read-only /usr/bin, so `corepack enable` fails.
    # Use npx to run the pinned pnpm instead.
    buildCommand: >-
      npx --yes pnpm@10.26.1 install --frozen-lockfile &&
      npx --yes pnpm@10.26.1 -r --filter @workspace/api-server... run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # No SPA is bundled in this service — run in pure API mode.
      - key: SERVE_FRONTEND
        value: "false"
      # Comma-separated list of exact browser origins allowed to call the API.
      # Add your Vercel production + preview domains and any custom domain.
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false   # Set this manually in the Render dashboard → your Supabase URI
      - key: JWT_SECRET
        generateValue: true
